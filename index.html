<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шесть слепых слонов · курс по книге Стива Андреаса</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2311141b'/%3E%3Ccircle cx='25' cy='32' r='13' fill='none' stroke='%2337e0c0' stroke-width='4'/%3E%3Crect x='28' y='19' width='22' height='26' rx='5' fill='none' stroke='%23a98bff' stroke-width='4' stroke-dasharray='5 3'/%3E%3Ccircle cx='33' cy='32' r='3.5' fill='%23d4f45a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c11; --bg2:#0e1117; --surface:#12151c; --plate:#171b25; --plate2:#1d2230;
  --line:#252b3a; --line2:#323a4e;
  --text:#eceef4; --text2:#b8bdcb; --muted:#828aa0;
  --c1:#37e0c0; --c2:#ff8a4c; --c3:#a98bff; --c4:#ff5c9a; --c5:#d4f45a; --c6:#4cb2ff;
  --acc:var(--c1);
  --r:14px; --r2:20px;
  --side:288px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(600px 400px at 85% -5%, rgba(169,139,255,.13), transparent 70%),
   radial-gradient(500px 380px at 30% 110%, rgba(55,224,192,.08), transparent 70%);}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
::selection{background:rgba(212,244,90,.3)}
:focus-visible{outline:2px solid var(--c5);outline-offset:2px;border-radius:6px}

/* ===== layout ===== */
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:rgba(14,17,23,.92);backdrop-filter:blur(12px);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .3s ease}
.side-head{padding:22px 22px 16px;display:flex;align-items:center;gap:12px;text-decoration:none}
.logo{width:40px;height:40px;flex:none}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.progress-box{margin:0 22px 14px;padding:12px 14px;background:var(--plate);border-radius:12px;border:1px solid var(--line)}
.progress-box .row{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:8px}
.progress-box .row b{color:var(--text)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--c1),var(--c6) 40%,var(--c3) 70%,var(--c4));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.nav{flex:1;overflow-y:auto;padding:4px 12px 24px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.nav-group{margin-top:14px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px;display:flex;align-items:center;gap:8px;font-weight:600}
.nav-label i{width:8px;height:8px;border-radius:50%}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--text2);text-decoration:none;transition:background .15s,color .15s;line-height:1.35}
.nav a:hover{background:var(--plate);color:var(--text)}
.nav a.active{background:var(--plate2);color:var(--text)}
.nav a .n{width:22px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.nav a .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line2);margin-left:auto;flex:none}
.nav a.done .dot{background:var(--c5);border-color:var(--c5)}
.nav a.tool{font-weight:500;color:var(--text)}
.nav a.tool svg{width:18px;height:18px;flex:none}

.main{margin-left:var(--side);flex:1;min-width:0}
.topbar{display:none}
.wrap{max-width:1200px;padding:48px 56px 96px}

/* ===== typography ===== */
h1{font-size:48px;line-height:1.08;letter-spacing:-.03em;font-weight:800}
h2{font-size:28px;line-height:1.2;letter-spacing:-.02em;font-weight:700;margin-bottom:14px}
h3{font-size:19px;line-height:1.3;font-weight:650;letter-spacing:-.01em;margin-bottom:8px}
p{color:var(--text2);margin-bottom:12px}
p b, li b{color:var(--text);font-weight:600}
.lead{font-size:19px;line-height:1.55;color:var(--text2);max-width:680px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.eyebrow i{width:18px;height:2px;background:var(--acc);border-radius:2px}
ul.clean{list-style:none}
.content ul:not(.clean){padding-left:0;list-style:none;margin:6px 0 14px}
.content ul:not(.clean) li{position:relative;padding-left:20px;color:var(--text2);margin-bottom:6px}
.content ul:not(.clean) li::before{content:"";position:absolute;left:4px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--acc)}
q,.q{color:var(--text);font-style:normal}
q::before{content:"«"}q::after{content:"»"}
mark{background:rgba(212,244,90,.14);color:var(--c5);padding:0 4px;border-radius:4px}

/* ===== components ===== */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:11px;padding:11px 18px;font-size:14.5px;font-weight:600;background:var(--acc);color:#0a0c11;text-decoration:none;transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px -8px var(--acc);filter:brightness(1.05)}
.btn.ghost{background:var(--plate);color:var(--text);border:1px solid var(--line2)}
.btn.ghost:hover{box-shadow:none;border-color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--plate2);color:var(--text2);border:1px solid var(--line)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:24px}
.plate{background:var(--plate);border-radius:var(--r);padding:16px 18px;border:1px solid var(--line)}
.key{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--plate);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:16px 18px;margin:18px 0}
.key .t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.key p:last-child{margin-bottom:0}
.example{background:var(--bg2);border:1px dashed var(--line2);border-radius:12px;padding:14px 16px;margin:14px 0}
.example .t{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.example p:last-child{margin-bottom:0}

/* home */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center;margin-bottom:56px}
.hero h1 span{background:linear-gradient(95deg,var(--c1),var(--c6) 35%,var(--c3) 65%,var(--c4));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.parable{position:relative;padding:26px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.parable p{font-size:15px}
.parable .who{font-size:12px;color:var(--muted);margin-top:10px}
.elephants{display:flex;gap:8px;margin-bottom:18px}
.elephants span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0a0c11;animation:bob 3s ease-in-out infinite}
.elephants span:nth-child(2){animation-delay:.2s}.elephants span:nth-child(3){animation-delay:.4s}.elephants span:nth-child(4){animation-delay:.6s}.elephants span:nth-child(5){animation-delay:.8s}.elephants span:nth-child(6){animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.section{margin-bottom:56px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.section-head p{margin:0;max-width:560px}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.map .card{position:relative;overflow:hidden}
.map .card .num{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.map .card .num i{width:10px;height:10px;border-radius:3px}
.map .card p{font-size:14.5px}
.map .card::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--pc);opacity:.08;filter:blur(4px)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lesson-tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,transform .2s,background .2s;min-height:112px}
.lesson-tile:hover{border-color:var(--pc);transform:translateY(-2px);background:var(--plate)}
.lesson-tile .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.lesson-tile .top i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.lesson-tile b{font-size:15px;line-height:1.3;font-weight:600}
.lesson-tile small{font-size:13px;color:var(--muted);line-height:1.4}
.lesson-tile.done .top::after{content:"пройдено";color:var(--c5);font-size:11px}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.howto .plate b{display:block;margin-bottom:4px;font-size:15px}
.howto .plate span{font-size:13.5px;color:var(--text2);line-height:1.45;display:block}
.howto .plate .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;font-weight:800;color:#0a0c11}

/* lesson */
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:48px;align-items:start}
.content{max-width:740px}
.lesson-head{margin-bottom:28px}
.lesson-head h1{font-size:40px;margin-bottom:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.block{margin:36px 0}
.block h2{font-size:23px;display:flex;gap:12px;align-items:baseline}
.block h2 .bn{font-size:13px;color:var(--acc);font-weight:700;min-width:22px}
.figure{margin:20px 0;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:20px;overflow:hidden}
.figure svg{width:100%;height:auto;display:block}
.figure figcaption{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.45}
.aside{position:sticky;top:28px;display:flex;flex-direction:column;gap:14px}
.aside .plate h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.aside ol{padding-left:18px;color:var(--text2);font-size:14px}
.aside ol li{margin-bottom:8px;line-height:1.45}
.aside ol li::marker{color:var(--acc);font-weight:700}
.toc a{display:block;font-size:13.5px;color:var(--text2);text-decoration:none;padding:4px 0 4px 12px;border-left:2px solid var(--line);line-height:1.4}
.toc a:hover{color:var(--text);border-color:var(--acc)}
.lesson-foot{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager{display:flex;flex-direction:column;gap:2px;text-decoration:none;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:220px;max-width:48%;flex:1}
.pager:hover{border-color:var(--acc)}
.pager small{font-size:12px;color:var(--muted)}
.pager b{font-size:14.5px;font-weight:600}
.pager.next{text-align:right}

/* quiz */
.quiz{margin:36px 0}
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}
.qitem .qq{font-weight:600;color:var(--text);margin-bottom:12px;font-size:15.5px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--plate);border:1px solid var(--line);color:var(--text2);border-radius:11px;padding:11px 14px;font-size:14.5px;line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line2);color:var(--text)}
.opt.ok{border-color:var(--c1);background:rgba(55,224,192,.08);color:var(--text)}
.opt.bad{border-color:var(--c4);background:rgba(255,92,154,.07)}
.qexp{display:none;margin-top:12px;font-size:14px;color:var(--text2);padding:12px 14px;border-radius:10px;background:var(--bg2)}
.qexp.show{display:block;animation:fade .3s}
.qexp b{color:var(--c1)}
.qexp.wrong b{color:var(--c4)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.score{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:var(--plate);border:1px solid var(--line);margin-top:6px}
.score .ring{width:46px;height:46px;flex:none}

/* practice */
.ex-head{margin-bottom:24px}
.ex-head h1{font-size:36px;margin-bottom:12px}
.ex-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.steps-nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps-nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--plate);color:var(--text2);font-weight:600;font-size:13px;transition:all .15s}
.steps-nav button.cur{background:var(--acc);color:#0a0c11;border-color:var(--acc)}
.steps-nav button.filled:not(.cur){border-color:var(--acc);color:var(--text)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:26px;animation:fade .3s}
.step .sn{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.step h2{font-size:24px;margin-bottom:12px}
.step .pause{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--c5);background:rgba(212,244,90,.08);border-radius:8px;padding:4px 10px;margin:4px 0 12px}
textarea,input[type=text],select{width:100%;font-family:inherit;font-size:15px;color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;line-height:1.5;resize:vertical;transition:border-color .15s,box-shadow .15s}
textarea{min-height:110px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
::placeholder{color:#5c647a}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--text2);margin:14px 0 6px}
.step-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.saved i{width:6px;height:6px;border-radius:50%;background:var(--c5)}
.timer{display:flex;align-items:center;gap:12px}
.timer .tv{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.done-box{text-align:left;padding:30px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--acc)}

/* trainer */
.drill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:24px;margin-bottom:18px}
.drill-card{font-size:20px;font-weight:600;line-height:1.4;padding:26px;border-radius:16px;background:var(--plate);border:1px solid var(--line);margin:14px 0;min-height:110px;display:flex;align-items:center}
.drill-btns{display:flex;gap:8px;flex-wrap:wrap}
.drill-btns .btn{flex:1;justify-content:center;min-width:140px}
.drill-fb{margin-top:12px;font-size:14.5px;min-height:24px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{border:1px solid var(--line2);background:var(--plate);color:var(--text2);padding:9px 14px;border-radius:11px;font-size:14px;font-weight:500}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.order-list{display:grid;gap:8px;margin-top:12px}
.order-list button{text-align:left;padding:12px 14px;border-radius:11px;border:1px solid var(--line2);background:var(--plate);color:var(--text);font-size:15px;display:flex;gap:10px;align-items:center}
.order-list button .pos{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--line);font-size:12px;font-weight:700;color:var(--text2)}
.order-list button.picked .pos{background:var(--acc);color:#0a0c11}
.mango{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.mango button{font-size:22px;font-weight:600;padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--plate);color:var(--text)}
.mango button.on{background:var(--acc);color:#0a0c11;border-color:var(--acc);text-transform:uppercase}

/* circles exercise */
.circles{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:10px auto}
.circles .c{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:10px;font-size:13px;line-height:1.3;font-weight:500;border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--bg2));color:var(--text);transform:translate(-50%,-50%);transition:all .5s cubic-bezier(.2,.8,.2,1);overflow:hidden;word-break:break-word}
.circles .c.center{width:32%;border-style:dashed;font-weight:700;font-size:14px}

/* glossary & journal */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gloss .plate b{display:block;margin-bottom:4px;color:var(--text)}
.gloss .plate span{font-size:14px;color:var(--text2);line-height:1.5;display:block}
.gloss .plate a{font-size:12px;color:var(--acc);text-decoration:none;margin-top:8px;display:inline-block}
.journal-entry{margin-bottom:14px}
.journal-entry h3{display:flex;justify-content:space-between;gap:10px;align-items:center}
.journal-entry .a{font-size:14px;color:var(--text2);white-space:pre-wrap;margin:6px 0 10px;padding-left:12px;border-left:2px solid var(--line2)}
.journal-entry .a b{display:block;color:var(--muted);font-size:12px;font-weight:600}
.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line2);border-radius:16px}

.ex-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ex-tile{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .2s,transform .2s}
.ex-tile:hover{border-color:var(--pc);transform:translateY(-2px)}
.ex-tile b{font-size:16px;font-weight:600;line-height:1.3}
.ex-tile small{color:var(--muted);font-size:13.5px;line-height:1.45}
.ex-tile .tags{display:flex;gap:6px;flex-wrap:wrap}
.ex-tile .tags span{font-size:11.5px;color:var(--text2);background:var(--plate2);padding:3px 8px;border-radius:6px}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.view{animation:fade .35s}
.overlay{display:none}

/* svg helpers */
.svg-t{font-family:Inter,sans-serif;fill:var(--text2);font-size:13px}
.svg-h{font-family:Inter,sans-serif;fill:var(--text);font-size:14px;font-weight:600}
.svg-s{font-family:Inter,sans-serif;fill:var(--muted);font-size:11.5px}

/* responsive */
@media (max-width:1180px){
  .lesson-grid,.ex-layout{grid-template-columns:1fr}
  .aside{position:static;display:grid;grid-template-columns:1fr 1fr}
  .toc-plate{display:none}
  .hero{grid-template-columns:1fr}
  .howto{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .side{transform:translateX(-100%);box-shadow:20px 0 60px rgba(0,0,0,.5)}

const LESSONS = [
/* ---------- 1 ---------- */
{id:"scope", part:1, title:"Диапазон во времени и пространстве", short:"Какой кусок события попадает в кадр",
lead:"Любое событие мы видим кусочком. Сколько времени и пространства попадает в этот кусочек, Андреас называет диапазоном. С этого слова начинается вся книга.",
blocks:[
{h:"Что такое диапазон", html:`
<p>Диапазон: часть сенсорного опыта, то, что можно увидеть, услышать или почувствовать телом. Он бывает в настоящем, в воспоминании и в прогнозе на будущее.</p>
<p>Жизнь идёт непрерывно, и из этого потока мы вырезаем отрезки: <q>утро</q>, <q>разговор на кухне</q>, <q>вся прошлая зима</q>. Отрезок может быть в несколько секунд или в несколько лет. Так же с пространством: <q>эта чашка</q>, <q>моя комната</q>, <q>весь город</q>.</p>
<div class="key"><div class="t">Запомни</div><p>Диапазон всегда можно показать пальцем или поставить на таймлайн. Если на вопрос «где и когда это было?» есть ответ, ты имеешь дело с диапазоном.</p></div>`},
{h:"Три отношения между диапазонами", fig:"scopeRelations", html:`
<p>Когда в голове два отрезка опыта, между ними возможны всего три отношения:</p>
<ul>
<li><b>Вложенный.</b> Один диапазон целиком внутри другого. Минута внутри часа, кухня внутри квартиры. Это отношение «часть и целое».</li>
<li><b>Раздельные.</b> Общих частей нет. Вторник и пятница, твоя квартира и квартира соседа.</li>
<li><b>Пересекающиеся.</b> Есть общая часть. Твой отпуск и отпуск коллеги совпали на три дня.</li>
</ul>`},
{h:"Почему люди спорят о разном", html:`
<p>Двое обсуждают <q>вчерашний вечер</q>. Один думает про ссору в 23:00. Другой держит в голове весь вечер: ужин, прогулку, фильм и короткую ссору в конце. Каждый прав внутри своего отрезка, поэтому договориться они не могут.</p>
<div class="example"><div class="t">Простой вопрос, который снимает половину конфликтов</div><p><q>Подожди, о каком отрезке ты говоришь? С какого момента и до какого?</q></p></div>
<p>Когда оба уточнили границы, становится видно, что они спорили о разных событиях. После этого уже можно обсуждать, как по-разному каждый о них думает.</p>`},
{h:"Узкий и широкий кадр", fig:"zoom", html:`
<p>Узкий диапазон помогает сосредоточиться. Хирург видит операционное поле, вратарь видит мяч. Когда нужно решить задачу здесь и сейчас, сужение собирает все силы в одной точке.</p>
<p>У сужения есть обратная сторона: из кадра вылетает информация, без которой решения не найти. Это туннельное зрение. Маркеры такого сужения в речи: <mark>только</mark>, <mark>лишь</mark>, <mark>просто</mark>.</p>
<div class="example"><div class="t">Пример</div><p><q>Он только и делает, что критикует.</q> В кадр попали эпизоды критики. Все случаи, когда этот человек помогал или хвалил, остались за рамкой.</p></div>`},
{h:"Экологическая проверка", html:`
<p>Перед тем как закрепить любое изменение, Андреас предлагает расширить кадр: посмотреть, как новая реакция скажется дома, на работе, в отношениях, через месяц и через год. Если внутри появляется сопротивление или тревога, это сигнал. Его стоит выслушать и учесть, прежде чем идти дальше.</p>`}
],
keys:["Диапазон: кусок опыта во времени и пространстве.","Между двумя диапазонами три отношения: вложенный, раздельные, пересекающиеся.","В споре сначала сверь границы отрезков.","«Только» и «лишь» сужают кадр.","Перед изменением сделай экологическую проверку."],
quiz:[

{q:"Что делает фраза «Ты только и делаешь, что споришь»?", o:["Расширяет диапазон до всей истории отношений","Сужает диапазон и выбрасывает все эпизоды без споров","Переводит разговор на более общую категорию"], a:1, e:"Слово «только» оставляет в кадре один тип эпизодов. Остальное исчезает из поля зрения."},
{q:"Отпуск с 1 по 14 июля и командировка с 10 по 20 июля:", o:["Вложенные","Раздельные","Пересекающиеся"], a:2, e:"У них есть общая часть: с 10 по 14 июля."},
{q:"Зачем нужна экологическая проверка?", o:["Чтобы быстрее закончить упражнение","Чтобы увидеть, как изменение скажется на других сферах жизни, до того как его закрепить","Чтобы убедить себя, что изменение правильное"], a:1, e:"Проверка расширяет диапазон во времени и пространстве и показывает возможные побочные эффекты."}
],

/* ---------- 2 ---------- */
{id:"category", part:1, title:"Категория", short:"Как разный опыт собирается в одну группу",
lead:"Когда ты говоришь «собака», ты уже собрал сотни отдельных встреч с разными собаками в одну группу. Эта группа называется категорией.",
blocks:[
{h:"Как рождается категория", fig:"induction", html:`
<p>Мы замечаем, чем разные случаи похожи, и объединяем их. Этот процесс называется <b>индукцией</b> или обобщением. Обратный процесс, <b>различение</b>, убирает из группы то, что слишком сильно отличается.</p>
<div class="example"><div class="t">Как это видно у детей</div><p>Малыш сначала зовёт «собачкой» любое четвероногое: кошку, корову, лошадь. Потом он замечает различия и выделяет кошек в отдельную группу. Работают обобщение и различение.</p></div>`},
{h:"Базовый уровень", html:`
<p>Слова вроде <q>стул</q>, <q>собака</q>, <q>яблоко</q> относятся к категориям базового уровня. Это самый удобный для мозга уровень: легко представить картинку, легко назвать, легко показать ребёнку. Слова <q>мебель</q> или <q>животное</q> уже абстрактнее, у них нет одной общей картинки.</p>`},
{h:"Критерии бывают явными и скрытыми", html:`
<p>Чтобы что-то попало в категорию, нужен критерий: признак, по которому мы решаем, «наше» это или нет. Критерий может быть осознанным или неосознанным, чётким или «туманным». Часто его видно только по набору примеров: смотришь, что их объединяет, и догадываешься.</p>
<p>Членство в категории задаётся тремя способами: перечнем примеров, явными критериями или правилом, по которому проверяют новый случай.</p>`},
{h:"Любая категория дискретна", fig:"discrete", html:`
<p>Реальный опыт аналоговый. Цвет, рост, громкость меняются плавно. Категория устроена иначе: опыт или входит в неё, или не входит. Третьего нет.</p>
<p>Поэтому на границе категорий всегда есть спорные случаи. Где кончается «тёплый» и начинается «горячий»? Каждый ставит порог в своём месте.</p>`},
{h:"Категория решает, как мы реагируем", html:`
<p>Партнёр молча сидит вечером. Если отнести это к категории <q>обиделся на меня</q>, появится тревога. Если к категории <q>устал после работы</q> или <q>зачитался</q>, реакция будет спокойной. Событие одно и то же, меняется только полка, на которую мы его кладём.</p>
<div class="key"><div class="t">Главная мысль</div><p>Мы реагируем на категорию, в которую положили событие. Сменилась категория, сменилась и реакция.</p></div>`}
],
keys:["Категория: группа примеров, похожих по какому-то критерию.","Её создаёт обобщение, уточняет различение.","Опыт аналоговый, категория дискретна: «да» или «нет».","Реакция зависит от того, к какой категории отнесено событие."],
quiz:[
{q:"Ребёнок перестаёт называть кошку собачкой. Какой процесс сработал?", o:["Индукция (обобщение)","Различение","Расширение диапазона"], a:1, e:"Различение исключает из категории то, что сильно отличается от остальных примеров."},
{q:"Почему любая категория дискретна?", o:["Потому что примеры в ней одинаковые","Потому что опыт либо относится к ней, либо нет","Потому что у неё всегда один критерий"], a:1, e:"Сами примеры отличаются плавно, а решение о членстве всегда бинарное."},
{q:"Какое слово относится к базовому уровню?", o:["Мебель","Стул","Офисный стул на колёсиках"], a:1, e:"«Стул» легко представить одной картинкой. «Мебель» выше, «офисный стул» уже подкатегория."}
],
practice:["category-script"]},

/* ---------- 3 ---------- */
{id:"prototype", part:1, title:"Прототип", short:"Один пример, который подменяет всю категорию",
lead:"Чтобы быстро понять слово, мозг берёт один пример и подставляет его вместо всей категории. Такой пример называется прототипом. Он даёт категории смысл и одновременно его искажает.",
blocks:[
{h:"Зачем нужен прототип", html:`
<p>Можно было бы перебирать в голове все примеры категории. Это долго. Поэтому мозг держит под рукой одну внутреннюю картинку и опирается на неё. Скажи себе <q>птица</q> и посмотри, что всплыло. У большинства людей это кто-то маленький и летающий, вроде воробья или синицы.</p>`},
{h:"Шесть видов прототипов", html:`
<ul>
<li><b>Типичный пример.</b> Воробей для «птицы».</li>
<li><b>Средний пример.</b> Средний рост, средняя зарплата.</li>
<li><b>Выдающийся пример.</b> Яркий случай, который запомнился. Авиакатастрофа из новостей для слова «перелёт».</li>
<li><b>Идеал.</b> Идеальный партнёр, идеальное тело. В жизни его не бывает.</li>
<li><b>Образец.</b> Эталон, по которому сверяют. Эталон метра, образцовый отчёт.</li>
<li><b>Стереотип.</b> Упрощённый образ группы людей.</li>
</ul>`},
{h:"Категория устроена как мишень", fig:"radial", html:`
<p>Внутри категории примеры неравноправны. Андреас описывает её как радиальную структуру: в центре прототип, ближе к краям менее обычные члены. Пингвин и страус тоже птицы, но стоят на самом краю, поэтому фраза <q>пингвин птица</q> звучит чуть странно.</p>`},
{h:"Как прототип искажает опыт", html:`
<p>Выбор одного примера всегда искажает опыт: остальные примеры теряются из виду. Если прототип слова <q>начальник</q> это первый жёсткий руководитель, каждый новый начальник заранее видится через него.</p>
<p>Один яркий случай весит больше сотни обычных. Андреас замечает, что многие из нас уделяют прототипам и категориям больше внимания, чем реальному миру вокруг.</p>
<div class="key"><div class="t">Рабочий вопрос</div><p>«Какой пример всплывает у меня, когда я думаю об этом слове?» Смени этот пример, и смысл всей категории сдвинется.</p></div>`}
],
keys:["Прототип: пример, который заменяет всю категорию.","Виды: типичный, средний, выдающийся, идеал, образец, стереотип.","Категория радиальна: центр и края.","Прототип всегда искажает, его можно заменить."],
quiz:[
{q:"Человек боится летать, потому что помнит репортаж о катастрофе. Какой это прототип?", o:["Средний пример","Выдающийся (яркий) пример","Образец"], a:1, e:"Яркий запоминающийся случай подменяет тысячи обычных спокойных рейсов."},
{q:"Почему «пингвин птица» звучит странновато?", o:["Пингвин не птица","Пингвин далеко от прототипа, на краю радиальной структуры","У категории «птица» нет прототипа"], a:1, e:"Пингвин входит в категорию, но стоит на её краю, далеко от типичного образа."},
{q:"Что произойдёт, если заменить прототип категории?", o:["Ничего, категория останется прежней","Изменится смысл и реакция на всю категорию","Категория исчезнет"], a:1, e:"Прототип даёт категории значение. Другой прототип даёт другое значение."}
],

/* ---------- 4 ---------- */
{id:"criteria", part:1, title:"Критерии", short:"Признаки, по которым мы отбираем опыт",
lead:"Критерий решает, попадёт опыт в категорию или останется за дверью. Большинство критериев работает незаметно, и их стоит вытащить на свет.",
blocks:[
{h:"Конкретные и общие", html:`
<p>Критерий бывает сенсорным: <q>голубой</q>, <q>громкий</q>, <q>тёплый</q>. Его можно проверить органами чувств. А бывает общим: <q>умный</q>, <q>надёжный</q>, <q>красивый</q>. Такой критерий сам является категорией, и у него есть свои критерии.</p>`},
{h:"Дискретные и аналоговые", fig:"threshold", html:`
<p>Дискретный критерий отвечает «да» или «нет»: есть права или нет. Аналоговый работает по шкале «больше или меньше»: опыт, зарплата, расстояние. У многих аналоговых критериев есть <b>порог</b>, после которого они становятся дискретными: до 40 минут дороги квартира подходит, после уже нет.</p>`},
{h:"«И» сужает, «или» расширяет", html:`
<p>Критерии соединяются союзами. <q>Умный, и добрый, и с чувством юмора, и спортивный</q> сильно сужает круг. <q>Умный или добрый</q> его расширяет. Чем больше критериев и чем они детальнее, тем меньше событий проходит через фильтр.</p>`},
{h:"Иерархия критериев", html:`
<p>Если выписать критерии и расставить их по важности, внимание пойдёт сначала на главное. При выборе квартиры один ставит первым безопасность района, другой дорогу до работы, третий солнечный свет. Явный порядок экономит месяцы сомнений.</p>`},
{h:"Перфекционизм и его противоположность", html:`
<p>Слишком жёсткие критерии приводят к перфекционизму: ничего не подходит, постоянное разочарование. Слишком мягкие ведут к обратному: человек соглашается на то, что его на самом деле не устраивает. Андреас называет полезным навыком подстройку критериев под контекст. Для черновика один уровень требований, для финальной версии другой.</p>
<div class="key"><div class="t">Важно</div><p>Неподходящий критерий даёт неподходящую реакцию. Если оценивать друга по критериям, которые годятся для делового партнёра, дружба будет постоянно «не дотягивать».</p></div>`}
],
keys:["Критерий: признак членства в категории.","Бывают сенсорные и общие, дискретные и аналоговые.","«И» сужает круг, «или» расширяет.","Расставь критерии по важности.","Подстраивай строгость под контекст."],
quiz:[
{q:"«Квартира должна быть не дальше 40 минут от работы». Что это за критерий?", o:["Чисто дискретный","Аналоговый с порогом","Общий, несенсорный"], a:1, e:"Время в пути меняется плавно, но после 40 минут критерий превращается в «нет»."},
{q:"Что сильнее сужает круг подходящих людей?", o:["Умный или добрый","Умный и добрый и спортивный","Добрый"], a:1, e:"Связка «и» требует выполнения всех условий сразу."},
{q:"Чем полезна подстройка критериев под контекст?", o:["Помогает избежать и перфекционизма, и согласия на неподходящее","Делает критерии мягче во всех ситуациях","Позволяет вообще отказаться от критериев"], a:0, e:"Строгость критериев зависит от задачи. В одних местах нужна высокая планка, в других достаточно средней."}
],

/* ---------- 5 ---------- */
{id:"levels", part:1, title:"Логические уровни", short:"Лестница от частного к общему",
lead:"Категории складываются в лестницу. Рекс входит в «собаки», собаки входят в «млекопитающие», млекопитающие в «животные». Такая лестница называется логическими уровнями.",
blocks:[
{h:"Включение категорий", fig:"tree", html:`
<p>Более общая категория стоит выше тех, что в неё входят. Проверка очень простая:</p>
<div class="key"><div class="t">Тест на уровень</div><p>«X является разновидностью Y?» Если да, Y находится на более высоком логическом уровне, чем X.</p></div>
<p>Собака является разновидностью млекопитающего. Значит, «млекопитающее» выше. На этом принципе построена любая классификация: биологическая, библиотечная, товарная.</p>`},
{h:"Наследственность и сужение", html:`
<ul>
<li><b>Наследственность.</b> Всё, что верно для верхней категории, верно и для нижней. Если млекопитающие кормят детёнышей молоком, собаки тоже.</li>
<li><b>Сужение.</b> Нижняя категория добавляет свой критерий. Из всех млекопитающих остаются только те, что лают. Круг членов становится уже.</li>
</ul>`},
{h:"Почти все слова называют категории", html:`
<p>Конкретный диапазон называется так: <q>вон тот дом (показываешь пальцем)</q>, <q>Вязовая улица, 112</q>, <q>Билл Сандерсон</q>. Слова <q>дом</q>, <q>улица</q>, <q>человек</q> уже категории. Пока их не уточнили, собеседник подставляет свой прототип.</p>`},
{h:"Когда уровни перепутаны", html:`
<div class="example"><div class="t">Классический прыжок вверх</div><p><q>Я провалил экзамен</q> описывает конкретное событие. <q>Я неудачник</q> относит всю личность к категории на очень высоком уровне. По принципу наследственности «неудачность» теперь распространяется на всё, что человек делает.</p></div>
<p>Полезно замечать такие прыжки и возвращаться на нужный уровень: какое событие, когда, где.</p>`}
],
keys:["Общая категория выше частной.","Тест: «X является разновидностью Y?»","Наследственность: свойства идут сверху вниз.","Сужение: внизу добавляется критерий.","Следи за прыжками от события к личности."],
quiz:[
{q:"Что выше по логическому уровню?", o:["Яблоко","Фрукт","Антоновка"], a:1, e:"Яблоко является разновидностью фрукта, антоновка является разновидностью яблока."},
{q:"«Все птицы откладывают яйца, значит, и воробей тоже». Какой принцип?", o:["Сужение","Наследственность","Индукция"], a:1, e:"Свойство верхней категории передаётся вниз."},
{q:"«Я опоздал на встречу, я безответственный человек». Что произошло?", o:["Расширение диапазона во времени","Прыжок от события к категории личности на высоком уровне","Смена прототипа"], a:1, e:"Одно событие стало основанием для категории про всю личность."}
],

/* ---------- 6 ---------- */
{id:"scope-vs-category", part:1, title:"Диапазон или категория?", short:"Главное различение книги и тест на него",
lead:"Вся книга держится на одном различении. Если научиться за секунду понимать, с чем ты работаешь, диапазоном или категорией, многие запутанные вещи распутываются сами.",
blocks:[
{h:"Тест в один вопрос", fig:"partVsKind", html:`
<ul>
<li><b>Диапазон:</b> «Мы говорим о части сенсорного опыта?» Колесо этой машины. Левая половина картины. Последние пять минут разговора.</li>
<li><b>Категория:</b> «Мы говорим о событии как о примере группы?» Машина как вид транспорта. Картина как пример импрессионизма. Разговор как пример ссоры.</li>
</ul>
<p>Диапазон делится на части или входит в большее целое. Категория делится на подкатегории или входит в более общую категорию.</p>`},
{h:"«Что нравится» и «что важно»", html:`
<p>Два похожих вопроса ведут в разные стороны.</p>
<div class="example"><div class="t">«Что тебе нравится в отпуске на море?»</div><p>Ответ уходит в детали опыта: тёплый песок, шум волн, запах соли. Это диапазон.</p></div>
<div class="example"><div class="t">«Чем для тебя важен отпуск на море?»</div><p>Ответ поднимается к категориям: свобода, отдых, время с семьёй. Это категории.</p></div>
<p>Этот контраст лежит в основе упражнения «Нравится и важно».</p>`},
{h:"Четыре направления вместо двух", fig:"fourWays", html:`
<p>В НЛП давно говорят о «чанкинге»: укрупнении и разукрупнении. Андреас показывает, что эти слова смешивали два разных движения. «Укрупнением» называли и переход к большему диапазону, и переход к более общей категории. На деле направлений четыре: диапазон больше, диапазон меньше, категория общее, категория конкретнее.</p>`},
{h:"Пример из терапии: чистый язык", html:`
<p>Джеймс Лоули и Пенни Томпкинс на основе работы Дэвида Гроува создали «символическое моделирование». Терапевт ничего не утверждает. Он задаёт вопросы из короткого списка и вставляет в них слова клиента. Попробуй определить, что выявляет каждый вопрос: диапазон или категорию.</p>
<div class="plate" style="margin:12px 0"><ol style="padding-left:20px;color:var(--text2);font-size:15px">
<li>И есть ли ещё что-то про …?</li><li>И каким является этот …?</li><li>И вот это … похоже на что?</li><li>И где …?</li><li>И в каком месте …?</li><li>И затем что происходит?</li><li>И что происходит потом?</li><li>И что происходит прямо перед …?</li><li>И откуда может взяться …?</li></ol></div>
<p>Вопросы о месте и о последовательности («где», «что потом», «что перед этим») меняют диапазон. Вопросы «каким является» и «похоже на что» работают с категорией, причём последний приглашает к метафоре.</p>`}
],
keys:["Часть опыта: диапазон. Пример группы: категория.","«Что нравится?» ведёт в диапазон.","«Что важно?» ведёт в категорию.","Направлений четыре: диапазон шире и уже, категория общее и конкретнее.","Чистый язык меняет и то, и другое одними вопросами."],
quiz:[
{q:"«Экран моего телефона». Что это?", o:["Диапазон: часть конкретного предмета","Категория: пример группы"], a:0, e:"Экран это часть сенсорно-очевидного предмета."},
{q:"«Мой телефон как пример гаджета». Что это?", o:["Диапазон","Категория"], a:1, e:"Телефон рассматривается как представитель группы."},
{q:"Вопрос «И что происходит потом?» меняет…", o:["Диапазон во времени","Категорию на более общую"], a:0, e:"Он сдвигает кадр дальше по времени."},
{q:"Вопрос «Чем для тебя важна эта работа?» скорее выявит…", o:["Детали опыта (диапазон)","Категории и ценности"], a:1, e:"«Важно» поднимает ответ к категориям."}
],
practice:["like-important","trainer:scopecat"]},

{id:"scope-change", part:2, title:"Изменение диапазона", short:"Сдвинь кадр, и смысл изменится",
lead:"Если поменять размер или положение кадра, событие начинает означать другое. Новых фактов при этом никто не добавляет со стороны: человек просто видит больше, меньше или другое из своего же опыта.",
blocks:[
{h:"Четыре способа изменить диапазон", fig:"scopeChanges", html:`
<p>Диапазон можно сделать <b>больше</b>, <b>меньше</b>, сдвинуть так, чтобы он <b>пересекался</b> с прежним, или взять совсем <b>другой</b>. Всё это можно делать во времени, в пространстве или сразу в обоих.</p>
<p>Изменение диапазона меняет количество и тип информации, на которую опирается человек. Это вытаскивает скрытые критерии и меняет то, как он категоризирует событие.</p>`},
{h:"Шире: причины и последствия", html:`
<div class="example"><div class="t">Пример</div><p>Сотрудник опоздал на совещание. В узком кадре это <q>безответственность</q>. Расширь кадр по времени: он два года не опаздывал ни разу, а сегодня отвёз соседку в больницу. Категория меняется сама.</p></div>
<p>Частый способ расширить диапазон: добавить прошлые причины и будущие последствия.</p>`},
{h:"Ошибка широкого кадра", html:`
<p>Растягивать сегодняшнее горе на далёкое будущее (<q>так будет всегда</q>) значит делать необоснованный прогноз. Андреас называет это неправильным использованием большого диапазона. С радостью работает та же механика: человек чувствует себя лучше, но заранее закладывает будущее разочарование.</p>`},
{h:"Уже: сила одного шага", html:`
<p>Иногда полезнее сузить кадр. Человеку в горе тяжело думать о годах впереди, а вот о сегодняшнем вечере думать можно. Спортсмену на дистанции полезно видеть следующий километр.</p>`},
{h:"Почему это чистый метод", html:`
<div class="key"><div class="t">Важное свойство</div><p>Меняя диапазон, ты не навязываешь человеку свои ценности. Новая категоризация рождается из его собственного опыта, критериев и истории. Поэтому изменения держатся.</p></div>
<p>Ещё один инструмент из этой главы: <b>линия времени</b>. У каждого прошлое и будущее как-то расположены в пространстве: сзади и спереди, слева и справа. Изменение этой структуры тоже меняет диапазон.</p>`}
],
keys:["Диапазон можно сделать больше, меньше, сдвинуть или заменить.","Шире: прошлые причины и будущие последствия.","Растягивать горе в будущее значит делать ложный прогноз.","Уже: фокус на ближайшем шаге.","Метод уважает ценности самого человека."],
quiz:[
{q:"«Эта ошибка испортит мне всю жизнь». Что не так с диапазоном?", o:["Он слишком узкий","Неприятное чувство растянуто на огромный будущий диапазон без оснований","Диапазон пересекается с чужим"], a:1, e:"Это необоснованный прогноз: сегодняшнее событие растянуто на всё будущее."},
{q:"Почему изменение диапазона называют чистым методом?", o:["Оно не требует слов","Оно опирается на опыт и ценности самого человека","Оно всегда расширяет кадр"], a:1, e:"Человек сам видит новое в своём опыте, и никто не подсовывает ему чужие оценки."},
{q:"Марафонцу тяжело на 30-м километре. Что поможет?", o:["Представить весь оставшийся путь","Сузить диапазон до следующего поворота","Вспомнить все прошлые неудачи"], a:1, e:"Узкий кадр собирает ресурсы на ближайшей задаче."}
],
practice:["scope-script","scope-category-script"]},

{id:"category-scope", part:2, title:"Как категория меняет диапазон", short:"Мы «видим» больше, чем есть перед глазами",
lead:"Отнеся событие к категории, мы тут же дорисовываем то, чего не видим. Андреас различает три способа, которыми категория расширяет диапазон.",
blocks:[
{h:"Три диапазона категории", fig:"threeScopes", html:`
<ul>
<li><b>Обозримый диапазон.</b> Насколько далеко в пространстве и времени тянется то, что мы наблюдаем, когда относим опыт к категории. Слово <q>гроза</q> включает тучи, ветер, гром и примерно час времени.</li>
<li><b>Выведенный диапазон.</b> По критериям категории мы делаем выводы о том, чего не воспринимаем. Видишь из-за забора кончик хвоста, думаешь <q>собака</q>, и уже знаешь, что у неё четыре лапы и она может залаять.</li>
<li><b>Совокупный диапазон.</b> Событие связывается со всеми другими примерами категории и с её прототипом.</li>
</ul>`},
{h:"Сила и опасность выводов", html:`
<p>Выведенный диапазон очень полезен: он экономит время и позволяет предсказывать. Он же лежит в основе предубеждений. Отнёс человека к группе, и тут же «знаешь» о нём кучу вещей, которых не видел.</p>
<div class="example"><div class="t">Пример</div><p><q>Он программист</q>. Сразу дорисовывается: интроверт, не любит общаться, играет в игры. Ничего из этого ты не наблюдал.</p></div>`},
{h:"Подходящая категория обогащает, неподходящая заражает", html:`
<p>Когда опыт лёг в подходящую категорию, он получает богатство всех её примеров. Когда в неподходящую, к нему прилипает всё лишнее. Одна неудачная шутка партнёра, отнесённая к категории <q>как мой бывший</q>, тянет за собой годы старой боли.</p>`},
{h:"Категория живёт дольше опыта", html:`
<p>Созданная однажды категория начинает предшествовать опыту и раскладывать новое по старым полкам. Это удобно и быстро. Из-за этого же трудно реагировать на события по-новому и творчески.</p>
<div class="key"><div class="t">Практический вывод</div><p>Совокупный диапазон можно использовать намеренно: собрать все важные факторы решения в одну картинку и рассмотреть их одновременно. Этому посвящено упражнение с кругами.</p></div>`}
],
keys:["Обозримый диапазон: сколько охватывает категория.","Выведенный: что мы дорисовываем по критериям.","Совокупный: связь со всеми примерами и прототипом.","Выводы полезны и одновременно рождают предубеждения."],
quiz:[
{q:"Слышишь сирену и думаешь: «где-то пожар, едут пожарные». Какой диапазон сработал?", o:["Обозримый","Выведенный","Совокупный"], a:1, e:"Ты сделал вывод о том, чего не видишь, по критериям категории."},
{q:"Новая ссора сразу напоминает все прошлые ссоры. Это…", o:["Совокупный диапазон категории","Сужение","Наследственность"], a:0, e:"Событие связалось со всеми примерами категории «ссора»."},
{q:"Почему трудно менять категории?", o:["Категория предшествует новому опыту и раскладывает его по-старому","Категорий слишком мало","Категории не связаны с опытом"], a:0, e:"Готовые категории заранее определяют, как будет воспринят новый опыт."}
],
practice:["aggregate"]},

/* ---------- 9 ---------- */
{id:"values", part:2, title:"Ценности", short:"Категории того, что нам важно",
lead:"Ценность: категория опыта, который удовлетворяет наши потребности или желания. У нас много ценностей, и чтобы им всем соответствовать, их приходится как-то упорядочивать.",
blocks:[
{h:"Два вида чувств", fig:"feelings", html:`
<ul>
<li><b>Чувства восприятия</b> дают факты: тепло, давление, звук, вкус. Они сообщают, что происходит снаружи и внутри тела.</li>
<li><b>Оценочные чувства</b> (нравится и не нравится) сообщают, насколько это важно для нас.</li>
</ul>
<p>Оценочные чувства и есть главный критерий ценностей. Они говорят «всё идёт хорошо» или предупреждают «что-то не так, пора менять».</p>`},
{h:"Ошибка логического уровня", html:`
<p>Многие методы пытаются напрямую убрать неприятное оценочное чувство и оставляют ситуацию как есть. Андреас указывает: оценочное чувство всегда стоит на более высоком логическом уровне, чем ситуация, которая его вызвала. Убирать сигнал, не трогая ситуацию, значит работать не на том уровне.</p>
<div class="example"><div class="t">Аналогия</div><p>Пожарная сигнализация пищит. Можно вынуть батарейку. Можно посмотреть, что горит.</p></div>`},
{h:"Разложить «состояние» на части", html:`
<p>Слово <q>состояние</q> размыто: оно означает то чувство, то целый пласт восприятия, мыслей и поведения. Полезнее разложить его на <b>модальности</b> (что видно, слышно, ощущается) и <b>субмодальности</b> (яркость, размер, расстояние, громкость, темп). Маленькую часть опыта изменить проще, и вариантов изменения становится больше.</p>`},
{h:"Заимствованные ценности", html:`
<p>Часть ценностей мы берём у родителей и общества без личного опыта. Это полезно: ребёнку незачем попадать под грузовик, чтобы понять ценность осторожности. Но если общественная ценность человеку не подходит, ему приходится подавлять свои естественные реакции. Иногда он даже сужает диапазон, чтобы не видеть конфликта.</p>`}
],

{id:"hierarchy", part:2, title:"Иерархия и гетерархия", short:"Что главнее и кто управляет",
lead:"Лестница категорий сама по себе ничего не говорит о важности или власти. «Собака» не командует «Рексом». Чтобы появилась иерархия контроля, нужен особый критерий отношений.",
blocks:[
{h:"Иерархия включения", html:`
<p>Простая иерархия, основанная на включении категорий, даёт наследственность и сужение. Её уровни не обязательно означают, что верхний важнее или управляет нижним.</p>`},
{h:"Иерархия важности и контроля", html:`
<p>Иерархия важности или контроля появляется, когда есть <b>критерий отношений</b>: правило, по которому члены разных уровней связаны друг с другом. В армии звание определяет, кто отдаёт приказ. Без такого правила уровни просто описывают, что во что входит.</p>
<p>Пример иерархии важности без контроля: метапрограммы. Они упорядочивают, что для человека важнее, но никто никем не управляет.</p>`},
{h:"Иерархия ценностей", html:`
<p>Общая иерархия ценностей помогает быстро реагировать в новых ситуациях, не тратя время на раздумья. Но любая иерархия статична и поэтому искажает: в разных контекстах приоритеты меняются. Здоровье важнее карьеры, пока вдруг не наступает неделя запуска проекта.</p>`},
{h:"Гетерархия: как комитет", fig:"heterarchy", html:`
<p>Нейробиолог изучал систему в стволе мозга, которая решает, спим мы или бодрствуем и на что смотрим. Её работу лучше описывает слово <b>гетерархия</b>. Это комитет, где каждый может говорить и слушать одновременно. Части мозга общаются и приходят к согласию, что сейчас срочнее всего. Управление временно получает та часть, у которой есть нужная срочная информация.</p>
<p>Другие примеры: любая природная экосистема, скачки, где лидер меняется по ходу забега, игра «камень, ножницы, бумага».</p>`}
],

{id:"significance", part:2, title:"Значимость: молекулы смысла", short:"Причина, эквивалентность и контекст",
lead:"Диапазоны и категории Андреас сравнивает с атомами смысла. Из них собираются молекулы: причина и следствие, эквивалентность и контекст. Через эти три формы мы связываем события между собой.",
blocks:[
{h:"Три формы", fig:"threeForms", html:`
<ul>
<li><b>Причина и следствие: X → Y.</b> <q>Твоё опоздание заставляет меня думать, что я тебе безразлична.</q></li>
<li><b>Эквивалентность: X = Y.</b> <q>Твоё опоздание означает, что я тебе безразлична.</q></li>
<li><b>Контекст: X в Y.</b> <q>Ты слишком X для Y.</q> <q>Опоздание на наше свидание.</q></li>
</ul>`},
{h:"Что теперь значит «рефрейминг»", html:`
<p>Андреас предлагает простое определение. Рефрейминг: любое вмешательство, которое меняет диапазон человека в пространстве и времени, или категорию того же диапазона, или и то и другое.</p>`},
{h:"Сначала соответствие, потом новое направление", html:`
<p>Предлагать новое значение проще в той же форме, в которой человек думает сейчас. Сначала присоединяешься к его связи, потом ведёшь к другой связи той же формы.</p>
<div class="example"><div class="t">Причина и следствие</div><p><q>Моё опоздание заставило тебя думать, что ты мне безразлична. И это заставило тебя проверить, насколько наши отношения тёплые.</q></p></div>
<div class="example"><div class="t">Эквивалентность</div><p><q>Ты подумала, что моё опоздание означает безразличие. А ты для меня так важна, что я ехал аккуратно, чтобы точно добраться целым.</q></p></div>
<div class="example"><div class="t">Контекст</div><p><q>Прости, что моё опоздание заставило тебя волноваться. И всё-таки опоздать лучше, чем совсем не прийти.</q></p></div>
<p>Эти фразы взяты как образцы структуры. В жизни слова будут свои.</p>`}
],

{id:"recat-same", part:2, title:"Рекатегоризация на том же уровне", short:"Другое слово, другие следствия",
lead:"Можно переложить событие в соседнюю категорию того же уровня. Новое слово подчёркивает другие стороны события и тянет за собой другие выводы.",
blocks:[
{h:"Переопределение", fig:"lateral", html:`
<p>У каждого слова свой выведенный и совокупный диапазон. Поэтому замена слова меняет реакцию.</p>
<div class="example"><div class="t">«Ненормальное» → «некомпетентное»</div><p>Ненормальность звучит как приговор. Некомпетентность значит, что человек ещё не научился. Учиться можно, значит, ситуацию можно изменить.</p></div>
<div class="example"><div class="t">«Неудача» → «обратная связь»</div><p>Неудача ставит точку. Обратная связь подразумевает, что из ошибки можно извлечь урок и в следующий раз отреагировать лучше.</p></div>`},
{h:"Нормализация и преувеличение", html:`
<p>Многие считают свою проблему или себя странными, патологическими. Если показать, что так реагирует большинство людей в похожей ситуации, внимание освобождается для самой задачи.</p>
<p>Обратный ход: <b>преувеличение</b>. Опиши проблему ещё мрачнее, и реальная на этом фоне начнёт выглядеть обычной.</p>`},
{h:"Переворот пресуппозиции", html:`
<p>Если в восприятии события есть тревожная пресуппозиция (скрытое допущение), её можно перевернуть. Вместе с ней переворачивается и реакция.</p>`},
{h:"Вниз, в подкатегорию", html:`
<p>Можно двинуться внутрь категории, к более конкретной подкатегории. <q>Ты всегда злишься</q> → <q>В каких именно ситуациях это бывает?</q> Огромная размытая категория распадается на несколько конкретных, с которыми можно работать.</p>`},

],

{id:"recat-higher", part:2, title:"Рекатегоризация на более высоком уровне", short:"Шаг вверх даёт свободу",
lead:"Более общая категория даёт больше свободы: у неё другие критерии, и она связывает событие с новыми соседями.",
blocks:[
{h:"Что даёт шаг вверх", fig:"upward", html:`
<ul>

<li>Общая категория включает и другие категории. Исходное событие получает новых соседей, а значит, новый совокупный диапазон.</li>

<div class="example"><div class="t">Пример</div><p><q>Ревность</q> → <q>один из способов беречь то, что для тебя ценно</q>. В той же категории есть забота, внимание, верность. Ревность получает соседей, и с ней становится проще работать.</p></div>`},
{h:"Пресуппозиции любой терапии", html:`
<p>Базовые допущения любого метода находятся на высоком уровне и окрашивают всё, что делает терапевт, словами и без слов.</p>
<ul>
<li>Медицинская модель: борьба с болезнью.</li>
<li>Религиозная модель: борьба со злом.</li>
</ul>
<p>Обе предполагают противостояние. Две пресуппозиции НЛП позволяют встать рядом с клиентом:</p>
<ul>
<li><b>Позитивное намерение.</b> За любым поведением стоит намерение, полезное для человека. К нему можно присоединиться и вместе искать другие способы его выполнить.</li>
<li><b>Лучший доступный выбор.</b> Люди всегда делают лучший выбор из того, что им доступно в данный момент. Это снимает обвинения за прошлое и предполагает, что человек способен на лучший выбор, когда у него появятся варианты.</li>

{id:"model-world", part:3, title:"Подтекст и модель мира", short:"Как сказать, не говоря прямо",
lead:"Каждое сообщение несёт подтекст: то, что сказано без слов. Одни подтексты привязаны к содержанию, другие свободны от него. Вторые Андреас называет паттернами «модели мира».",
blocks:[
{h:"Вербальный подтекст", fig:"implication", html:`
<p>Он опирается на допущение, что мир разделён на пары противоположностей. Говоришь что-то про одну половину пары, и слушатель достраивает противоположное про вторую.</p>
<div class="example"><div class="t">Пример</div><p><q>Сегодня ты пришёл вовремя.</q> Подтекст: обычно ты опаздываешь.</p></div>
<p>В отличие от пресуппозиций, подтекст трудно отследить в словах. Поэтому он сильнее действует и легко отрицается: «я ничего такого не говорил».</p>`},
{h:"Модель мира: фразы без содержания", html:`
<p>Когда человек застрял в проблеме, его категоризация обычно стоит на самом высоком логическом уровне: <q>Проблема в том, что она хочет меня контролировать, и это факт</q>. Другой возможности он просто не видит.</p>
<p>Паттерны модели мира напоминают о разнице между картой и территорией. Они оставляют содержание нетронутым и только подразумевают, что то же событие можно воспринять иначе. Шесть приёмов:</p>
<ul>
<li><b>Предикат нереальности:</b> «кажется», «должно быть». Образ становится менее чётким.</li>
<li><b>Предикат описания:</b> «видишь», «думаешь», «понимаешь». Представление ситуации отделяется от самой ситуации.</li>
<li><b>Ты и другие:</b> «для тебя». Подразумевается, что у других может быть другое понимание.</li>
<li><b>Интонация:</b> выделенное слово намекает на альтернативу. Попробуй на фразе «я не люблю зелёное манго» в тренажёре.</li>
<li><b>Время:</b> «теперь», «сейчас». Подразумевается, что раньше или позже может быть иначе.</li>
<li><b>Цитирование:</b> проблема повторяется как цитата, с вопросительной интонацией в конце.</li>
</ul>`},
{h:"Восемь фраз из книги", html:`
<p>Сформулируй проблему одной фразой, например <q>Мой муж никогда не думает о том, как его слова воспринимают другие</q>. Заметь, как она ощущается внутри… Потом попроси кого-нибудь прочитать тебе эти фразы, подставляя твою формулировку, и делай паузу после каждой:</p>
<div class="plate"><ol style="padding-left:20px;font-size:14.5px;color:var(--text2)">
<li>То есть тебе кажется, что …</li>
<li>Значит, ты видишь ситуацию так: …</li>
<li>Для тебя проблема в том, что …</li>
<li>То есть ты думаешь, что …</li>
<li>То есть теперь ты ощущаешь, что …</li>
<li>То, что ты вынес из этой ситуации, это …? (интонация вопроса)</li>
<li>Твоё понимание такое: «…»</li>
<li>Для тебя, как ты сейчас на это смотришь, проблема в том, что «…»?</li></ol></div>
<p>Каждая фраза звучит как простой пересказ и при этом расширяет диапазон за рамки прежнего опыта. В книге упражнение делается в тройке, а в практике здесь есть генератор, который подставит твою фразу и может прочитать её вслух.</p>`}
],
keys:["Подтекст опирается на пары противоположностей.","Он сильнее пресуппозиции, потому что его трудно поймать.","Модель мира: фразы без содержания, которые открывают другие взгляды.","«Кажется», «для тебя», «теперь» делают проблему мягче."],
quiz:[
{q:"«Наконец-то ты убрал на кухне». Подтекст?", o:["Ты молодец","Обычно ты не убираешь (или убираешь редко)","Кухня большая"], a:1, e:"«Наконец-то» указывает на противоположную часть дихотомии."},

{id:"negation", part:3, title:"Отрицание", short:"В опыте нет частицы «не»",
lead:"В сенсорном опыте отрицания не существует. Чтобы понять «не думай о белой обезьяне», нужно сначала её представить. Отсюда много проблем в общении.",
blocks:[
{h:"Как мы понимаем «не»", fig:"negation", html:`
<p>Чтобы обработать отрицание, мозг сначала создаёт образ того, что отрицается, а потом как-то от него избавляется: перечёркивает, отодвигает, заменяет другой картинкой. Первый шаг пропустить нельзя.</p>`},
{h:"Негативные цели работают медленнее", html:`
<p>Негативные команды, цели и критерии занимают больше времени и тянут к нежелательному результату: внутренний образ направляет внимание и поведение.</p>
<div class="example"><div class="t">Перевод в позитив</div><p><q>Не урони</q> → <q>Держи двумя руками</q><br><q>Не опаздывай</q> → <q>Приходи к девяти</q><br><q>Не хочу больше ссориться</q> → <q>Хочу говорить спокойно, даже когда не согласен</q></p></div>`},
{h:"«Но» стирает всё перед ним", html:`
<p><q>Хорошая работа, но…</q> Слушатель запоминает только то, что после «но». Слова <mark>но</mark>, <mark>да, но</mark>, <mark>даже если</mark> отрицают часть опыта. Простая замена на <mark>и</mark> сохраняет обе части в кадре.</p>
<div class="example"><div class="t">Сравни</div><p><q>Ты отлично выступил, но слайды были мелкие.</q><br><q>Ты отлично выступил, и в следующий раз сделаем шрифт на слайдах крупнее.</q></p></div>`},
{h:"Пара- и мета-сообщения", html:`
<p>Невербальные сигналы бывают двух типов. <b>Пара-сообщения</b> совпадают с содержанием и показывают, о каком диапазоне идёт речь (жест в сторону двери на словах «вон туда»). <b>Мета-сообщения</b> категоризируют всё сказанное на более высоком уровне: подмигивание превращает фразу в шутку.</p>
<p>Мета-сообщения требуют перевести плавную, аналоговую коммуникацию в дискретную категорию. При этом легко ошибиться, отсюда непонимание.</p>`}
],
keys:["Отрицание требует сначала представить отрицаемое.","Формулируй цели в позитиве.","«Но» стирает сказанное до него, «и» сохраняет обе части.","Мета-сообщения легко неверно понять."],
quiz:[
{q:"Почему «не волнуйся» часто усиливает волнение?", o:["Чтобы понять фразу, нужно сначала представить волнение","Человек не слышит частицу «не»","Это грубо"], a:0, e:"Отрицаемый образ создаётся раньше отрицания."},
{q:"Какая фраза оставит в кадре и похвалу, и пожелание?", o:["Отличный отчёт, но таблицы кривые","Отличный отчёт, и таблицы можно выровнять","Таблицы кривые, хотя отчёт неплохой"], a:1, e:"Союз «и» не стирает первую часть."}
],
practice:["trainer:negative"]},

{id:"judgment", part:3, title:"Суждение и предпочтение", short:"От «плохо» к «мне больше нравится»",
lead:"Суждение звучит как приговор миру. Предпочтение звучит как сообщение о себе. Это разные структуры, и переход от первой ко второй сильно меняет отношения.",
blocks:[
{h:"Структура суждения", fig:"judgment", html:`
<ul>
<li>Дискретно: <q>X плохой</q>. Хорошо или плохо, третьего нет.</li>
<li>В кадре только одна вещь, без альтернатив.</li>
<li>Претендует на всеобщность, будто это свойство самого X.</li>
<li>Утеряна информация: кому плохо, по какому критерию, по сравнению с чем.</li>
</ul>`},
{h:"Структура предпочтения", html:`
<ul>
<li>Аналогово: <q>Мне Y нравится больше, чем X</q>. Шкала, а на шкале много градаций.</li>
<li>В кадре оба варианта.</li>
<li>Личное: у других людей могут быть свои предпочтения.</li>
</ul>
<div class="key"><div class="t">Следствие</div><p>Предпочтения выражают наши ценности. Когда оба человека говорят о предпочтениях, их проще согласовать: каждый говорит, чего хочет, и можно искать способ, при котором оба это получат.</p></div>`},
{h:"Когда суждение кажется оправданным", html:`
<p>Люди склонны судить, когда чувствуют угрозу своим ценностям. Угроза бывает физической или экономической, а бывает угрозой самооценке. Она может быть сейчас или в будущем. Если понять, что именно под угрозой, проще перейти к предпочтению и поискать решение.</p>`}
],
keys:["Суждение: дискретно, одна вещь, всеобщность.","Предпочтение: шкала, два варианта, личное.","Предпочтения легче согласовать.","За суждением часто стоит ощущение угрозы."],
quiz:[
{q:"Какая фраза построена как предпочтение?", o:["Этот фильм ужасен","Мне больше нравятся фильмы с быстрым сюжетом, чем этот","Такое смотрят только глупые люди"], a:1, e:"Есть шкала, два варианта и указание, что это личная оценка."},

],

/* ---------- 17 ---------- */
{id:"qualifiers", part:3, title:"Определители и модальные операторы", short:"Маленькие слова, которые задают тон",
lead:"Пара слов в начале фразы может перекрасить всё, что идёт после. Андреас разбирает познавательные определители и модальные операторы.",
blocks:[
{h:"Оценивающие определители", html:`
<p><q>К сожалению</q>, <q>к счастью</q>, <q>увы</q>, <q>слава богу</q> стоят в начале и задают оценку всему высказыванию.</p>
<div class="example"><div class="t">Попробуй вслух</div><p><q>К сожалению, завтра понедельник.</q><br><q>К счастью, завтра понедельник.</q><br>Заметь, как меняется ощущение от одного и того же факта.</p></div>
<p>Есть ещё определители обучения: <q>интересно</q>, <q>любопытно</q>, <q>я замечаю</q>. Они ставят человека в позицию исследователя.</p>`},
{h:"Модальные операторы", fig:"modal", html:`
<ul>
<li><b>Желание:</b> хочу, хотелось бы, мечтаю.</li>
<li><b>Необходимость:</b> должен, надо, нужно, обязан.</li>
<li><b>Возможность:</b> могу, возможно, получится.</li>
<li><b>Выбор:</b> выбираю, решаю, предпочитаю.</li>
</ul>
<p>Желание и необходимость отвечают за мотивацию. Возможность и выбор описывают способы удовлетворить нужды и желания. Каждый оператор может быть слабым или сильным: от лёгкого желания до острой необходимости.</p>`},
{h:"Скрытая неконгруэнтность", html:`
<p>Все модальные операторы описывают ситуацию иначе, чем она есть прямо сейчас. Если ты чего-то хочешь, значит, у тебя этого нет. Если что-то возможно, значит, оно пока не существует. В каждом таком слове заложено небольшое расхождение с реальностью.</p>`},
{h:"Способ действия становится стилем", html:`
<p>Оператор цепляется к глаголу и задаёт способ действия ещё до содержания: <q>я должен позвонить</q>, <q>я хочу позвонить</q>, <q>я выбираю позвонить</q>. Этот способ легко отрывается от контекста и превращается в общий стиль жизни. Человек, у которого всё «надо», живёт в постоянной обязанности, даже когда речь об отдыхе.</p>`}
],
keys:["«К сожалению» и «к счастью» окрашивают всю фразу.","Желание и необходимость: мотивация.","Возможность и выбор: способы.","Оператор задаёт способ действия раньше содержания."],
quiz:[
{q:"«Я обязан ответить на письмо сегодня». Какой оператор?", o:["Желание","Необходимость","Возможность","Выбор"], a:1, e:"«Обязан» выражает необходимость."},
{q:"Какие операторы описывают способы удовлетворить нужды?", o:["Желание и необходимость","Возможность и выбор"], a:1, e:"Желание и необходимость дают мотивацию, а возможность и выбор дают пути."}
],
practice:["trainer:modal"]},

{id:"self-reference", part:3, title:"Ссылка на себя", short:"Сообщение, которое говорит о самом себе",
lead:"Некоторые сообщения описывают сами себя. Если научиться это замечать, многие обвинения теряют силу, а споры становятся понятнее.",
blocks:[
{h:"Что такое ссылка на себя", fig:"selfref", html:`
<p>Утверждение ссылается на себя, когда оно входит в ту же категорию, о которой говорит. <q>Я всегда говорю правду</q>: само это утверждение тоже должно быть правдой. <q>Эта фраза состоит из пяти слов</q> описывает саму себя.</p>`},
{h:"Сообщение об отношениях", html:`
<p>Любое высказывание об отношениях одновременно и описывает отношения, и само является примером поведения в этих отношениях.</p>
<div class="example"><div class="t">Пример</div><p><q>Ты меня никогда не слушаешь!</q>, сказанное с перебиванием собеседника. Сама фраза оказывается примером неслушания.</p></div>`},
{h:"Обвинение часто возвращается к обвинителю", html:`
<p><q>Ты упрямый</q>, сказанное человеком, который настаивает на своём. Если заметить это, можно ответить так, чтобы показать структуру, не нападая:</p>
<div class="example"><div class="t">Варианты ответа из книги</div><p><q>Каждый из нас хотел бы, чтобы другой с ним согласился.</q><br><q>Если я действительно упрямее вас, то разумнее будет вам изменить позицию.</q></p></div>
<p>Андреас советует сначала спросить себя: хочу ли я принять отношения, которые предлагает этот человек? Если он в позиции контроля или ты от него зависишь, иногда разумнее не указывать на ссылку на себя.</p>`}
],
keys:["Ссылка на себя: сообщение попадает в собственную категорию.","Фраза об отношениях одновременно пример этих отношений.","Обвинение часто применимо к обвиняющему.","Перед ответом реши, какие отношения ты хочешь."],
quiz:[
{q:"Где есть ссылка на себя?", o:["Я никогда ничего не обобщаю","Сегодня идёт дождь","Мне нравится кофе"], a:0, e:"Фраза «никогда не обобщаю» сама является обобщением."},
{q:"«Перестань меня контролировать!», сказанное в форме приказа. Что тут видно?", o:["Ничего особенного","Сообщение само является попыткой контроля","Это предпочтение"], a:1, e:"Требование перестать контролировать само контролирует."}
],
practice:["self-ref"]},

{id:"contradictions", part:3, title:"Внутренние противоречия", short:"«Будь спонтанным» и другие ловушки",
lead:"Любое сообщение несёт три функции сразу: информацию, команду и отношение. Когда они противоречат друг другу, человек попадает в ловушку.",
blocks:[
{h:"Три функции сообщения", fig:"triangle", html:`
<ul>
<li><b>Информация:</b> что сообщается.</li>
<li><b>Команда:</b> что слушатель должен сделать.</li>
<li><b>Отношение:</b> как говорящий определяет связь между собеседниками.</li>
</ul>
<p>Многое из этого передаётся без слов: тоном, позой, паузами.</p>`},
{h:"«Будь спонтанным»", html:`
<p>Классика: <q>Будь спонтанным!</q>, <q>Удиви меня!</q>, <q>Хоть раз скажи, что любишь, сам, без напоминаний</q>. Реакция должна быть одновременно спонтанной и выполненной по приказу. Выполнить невозможно.</p>
<p>Зеркальный вариант Андреас называет <b>«не будь спонтанным»</b>: <q>Не злись</q>, <q>Не грусти</q>, <q>Не бойся</q>. От человека требуют не проявлять естественных реакций, которые кому-то не нравятся. В обоих случаях спонтанное пытаются вызвать принуждением.</p>`},
{h:"«Быть» и «делать»", html:`
<div class="example"><div class="t">Пример</div><p><q>Сделай уже нормально, хотя ты, конечно, на это не способен.</q> Требуют действия и одновременно определяют человека как неспособного его совершить.</p></div>`},
{h:"Как выбраться", html:`
<ol style="padding-left:20px;color:var(--text2)">
<li style="margin-bottom:6px">Заметить ловушку.</li>
<li style="margin-bottom:6px">Понять, на какой функции она держится: информации, команде, отношении.</li>
<li style="margin-bottom:6px">Увидеть допущение «или-или»: будто реакция может быть только спонтанной или только приказной.</li>
<li>Найти вариант, где оба качества совмещаются, или выйти на уровень выше и обсудить сами отношения.</li>
</ol>`}
],
keys:["Три функции: информация, команда, отношение.","«Будь спонтанным» и «не будь спонтанным».","Противоречие «быть» и «делать».","Выход: заметить, разложить, снять «или-или»."],
quiz:[

{q:"Что объединяет обе ловушки спонтанности?", o:["Попытка принуждением вызвать или остановить спонтанную реакцию","Отрицание","Ссылка на прошлое"], a:0, e:"Противоречие между принуждением и спонтанностью."}
],

{id:"paradox", part:3, title:"Парадокс", short:"Маятник «правда-ложь» и четыре выхода",
lead:"Парадокс собирается из трёх деталей: абсолютное утверждение, ссылка на себя и отрицание. Убери любую из них, и маятник остановится.",
blocks:[
{h:"Как устроен парадокс", fig:"pendulum", html:`
<p><q>Это утверждение ложно.</q> Если оно истинно, значит, ложно. Если ложно, значит, истинно. Мысль качается, как маятник.</p>
<p>Парадокс хорошо описывает колеблющиеся системы: сон и бодрствование, вдох и выдох. А вот для описания устойчивых событий он не годится.</p>`},
{h:"Четыре выхода", html:`
<div class="plate" style="margin:10px 0">
<p><b>1. Ограничить.</b> Убрать абсолютность: «иногда», «некоторые», «часто». <q>Я иногда лгу</q> уже не парадокс.</p>
<p><b>2. Убрать ссылку на себя.</b> Пусть утверждение говорит о чём-то другом: <q>Предыдущая фраза ложна</q>.</p>
<p><b>3. Сказать без отрицания.</b> Переформулировать позитивно.</p>
<p style="margin:0"><b>4. Применить отрицание к себе.</b> Когда структура понятна, можно сознательно обернуть отрицание на само высказывание и выйти из колебания.</p></div>`},
{h:"Парадоксы в жизни", html:`
<div class="example"><div class="t">Пример</div><p><q>Я ни на что не способен.</q> Если человек способен так точно оценить себя, значит, на что-то он способен. Ограничение помогает: <q>Сейчас у меня не получается вот это</q>.</p></div>`}
],
keys:["Парадокс = абсолютность + ссылка на себя + отрицание.","Описывает колебания, но не устойчивые события.","Выходы: ограничить, убрать ссылку на себя, убрать отрицание, обернуть отрицание."],
quiz:[
{q:"Какие три элемента дают парадокс?", o:["Метафора, отрицание, вопрос","Абсолютное утверждение, ссылка на себя, отрицание","Причина, следствие, контекст"], a:1, e:"Убери любой из трёх, и парадокс исчезнет."},
{q:"«Иногда я говорю неправду». Какой выход использован?", o:["Ограничение","Убрали ссылку на себя","Убрали отрицание"], a:0, e:"Абсолют «всегда» заменён на «иногда»."}
],
practice:["trainer:paradox"]},

{id:"certainty", part:3, title:"Уверенность", short:"Откуда мы знаем, что это правда",
lead:"Как мы отличаем реальное от вымышленного? Ответ спрятан в характеристиках внутренних образов. Их можно исследовать и даже менять.",
blocks:[
{h:"Стратегия реальности", fig:"certainty", html:`
<p>Образы реальных событий обычно имеют характеристики, похожие на то, что мы воспринимали в реальном мире: размер, расстояние, цвет, движение, объём, звук. Мы переживаем их как истинные. Если у образа мало таких характеристик, он воспринимается как маловероятный.</p>`},
{h:"Внешние источники", html:`
<p>Когда нет прямого опыта, мы опираемся на внешние источники: авторитетов, свидетелей, книги. В идеале их стоит проверять на внутреннюю согласованность и сравнивать с тем, что уже известно из личного опыта. Самое надёжное доказательство реальности: <b>повторяющийся</b> личный сенсорный опыт. Даже в нём остаётся доля неуверенности.</p>`},
{h:"Уверенность выше по уровню", html:`
<p>Уверенность в переживании находится на более высоком логическом уровне, чем само переживание. Многие страдают от избыточной уверенности и создают проблемы себе и другим. Поэтому полезно уметь её снижать.</p>
<div class="key"><div class="t">Простой вызов</div><p>«Ты действительно в это веришь?» Один честный вопрос иногда возвращает гибкость.</p></div>
<p>Экспериментируя с характеристиками образов, будь бережен к себе. Дай обещание, что изменения временные и в конце всё вернётся на место. Это снимает внутреннюю тревогу.</p>`}
],

function bindLesson(id){
  const l=lessonById(id); if(!l) return;
  $$(".toc a").forEach(a=>a.onclick=()=>document.getElementById(a.dataset.go).scrollIntoView({behavior:"smooth"}));
  const upd=()=>{const q=S.quiz[l.id]||{};const n=Object.keys(q).length;if(n<l.quiz.length){$("#scoreBox").innerHTML="";return}
    const ok=l.quiz.filter((qq,i)=>q[i]===qq.a).length, pct=ok/l.quiz.length, r=19, c=2*Math.PI*r;
    $("#scoreBox").innerHTML=`<div class="score"><svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="${r}" fill="none" stroke="#252b3a" stroke-width="5"/><circle cx="23" cy="23" r="${r}" fill="none" stroke="${pct===1?"#d4f45a":"#ff8a4c"}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}" transform="rotate(-90 23 23)"/></svg><div><b>${ok} из ${l.quiz.length}</b><div style="font-size:14px;color:var(--text2)">${pct===1?"Отлично, материал уложился. Урок отмечен пройденным.":"Перечитай блоки, где были ошибки, и попробуй снова."}</div></div>${pct<1?`<button class="btn ghost sm" id="resetQ" style="margin-left:auto">Заново</button>`:""}</div>`;
    if(pct===1&&!S.done[l.id]){S.done[l.id]=1;save();renderNav();$("#markDone").textContent="Урок пройден ✓"}
    const rq=$("#resetQ"); if(rq) rq.onclick=()=>{delete S.quiz[l.id];save();render()};
  };
  $$(".qitem").forEach(it=>{const qi=+it.dataset.qi, qq=l.quiz[qi];
    $$(".opt",it).forEach(b=>b.onclick=()=>{ if((S.quiz[l.id]||{})[qi]!==undefined) return;
      const oi=+b.dataset.oi; S.quiz[l.id]=S.quiz[l.id]||{}; S.quiz[l.id][qi]=oi; save();
      $$(".opt",it).forEach((x,j)=>{if(j===qq.a)x.classList.add("ok");else if(j===oi)x.classList.add("bad")});
      const ex=$(".qexp",it); ex.innerHTML=(oi===qq.a?"<b>Верно.</b> ":"<b>Не совсем.</b> ")+qq.e; ex.classList.add("show"); if(oi!==qq.a)ex.classList.add("wrong"); upd();
    })});

}

/* ================= TIMER ================= */
function timerHTML(sec){return `<div class="plate" style="margin-top:16px"><div class="timer"><div class="tv" data-tv>${fmt(sec)}</div><button class="btn sm" data-tstart>Старт</button><button class="btn ghost sm" data-treset>Сброс</button></div><div class="timer-presets">${[1,3,5,10].map(m=>`<button class="btn ghost sm" data-tp="${m*60}">${m} мин</button>`).join("")}</div></div>`}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
let TIMER=null;
function bindTimer(root,sec){
  const tv=$("[data-tv]",root); if(!tv) return; let left=sec, base=sec, run=false;
  const st=$("[data-tstart]",root);
  const stop=()=>{clearInterval(TIMER);TIMER=null;run=false;st.textContent="Старт"};
  st.onclick=()=>{ if(run){stop();return} run=true; st.textContent="Пауза"; clearInterval(TIMER);
    TIMER=setInterval(()=>{left--;tv.textContent=fmt(Math.max(left,0)); if(left<=0){stop();beep();toast("Время вышло");left=base}},1000)};
  $("[data-treset]",root).onclick=()=>{stop();left=base;tv.textContent=fmt(left)};
  $$("[data-tp]",root).forEach(b=>b.onclick=()=>{stop();base=left=+b.dataset.tp;tv.textContent=fmt(left)});
}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.2);o.start(a.currentTime+t);o.stop(a.currentTime+t+.22)})}catch(e){}}

/* ================= FIELD BINDING ================= */
function fieldHTML(exId,f){const v=exData(exId)[f.k]||"";
  if(f.sel) return `<label class="fl">${f.l}</label><select data-k="${f.k}"><option value="">Выбери…</option>${f.sel.map(o=>`<option ${v===o?"selected":""}>${o}</option>`).join("")}</select>`;
  if(f.short) return `<label class="fl">${f.l}</label><input type="text" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||"")}" style="max-width:160px">`;
  return `<label class="fl">${f.l}</label><textarea data-k="${f.k}" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`}
function bindFields(exId,root,onChange){
  $$("[data-k]",root).forEach(el=>{const h=()=>{exData(exId)[el.dataset.k]=el.value;exData(exId)._t=Date.now();save();const sv=$("[data-saved]");if(sv){sv.style.opacity=1;clearTimeout(sv._t);sv._t=setTimeout(()=>sv.style.opacity=.5,900)}onChange&&onChange()};el.addEventListener("input",h);el.addEventListener("change",h)});
}

function bindEx(id){
  const e=exById(id); if(!e) return;

      $("#again").onclick=()=>{archive(id);S.step[id]=0;save();draw();toast("Прошлые записи сохранены в журнале")};return}
    const s=e.steps[cur];
    $("#stepBox").innerHTML=`<div class="step"><div class="sn">Шаг ${cur+1} из ${n}</div><h2>${s.t}</h2><p>${s.text}</p>${s.pause?`<div class="pause">◷ не торопись, дай себе паузу</div>`:""}${s.timer?timerHTML(s.timer):""}${s.f.map(f=>fieldHTML(id,f)).join("")}<div class="step-actions"><button class="btn ghost" id="prevS" ${cur===0?"disabled":""}>← Назад</button><button class="btn" id="nextS">${cur===n-1?"Завершить":"Дальше →"}</button></div></div>`;

  };
  draw();
}
function archive(id){const d=S.ex[id];if(!d)return;S.arch=S.arch||[];S.arch.push({id,t:Date.now(),d:JSON.parse(JSON.stringify(d))});delete S.ex[id];save()}
