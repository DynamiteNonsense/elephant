/* ================= TRAINER ================= */
const TABS=[["scopecat","Диапазон / категория"],["forms","Формы смысла"],["modal","Модальные операторы"],["paradox","Парадоксы"],["negative","Перевод в позитив"],["levels","Логические уровни"],["mango","Интонация"]];
function viewTrainer(tab){
  tab=TABS.some(t=>t[0]===tab)?tab:"scopecat";
  document.documentElement.style.setProperty("--acc","var(--c2)");
  return `<div class="view"><div class="ex-head"><div class="eyebrow"><i></i>Тренажёр</div><h1>Быстрые тренировки</h1><p class="lead">Короткие карточки, чтобы различения из книги стали автоматическими. Лучший результат по каждому тренажёру сохраняется.</p></div>
  <div class="tabs">${TABS.map(([k,n])=>`<button class="${k===tab?"on":""}" data-tab="${k}">${n}${S.drill[k]!==undefined?` · ${S.drill[k]}`:""}</button>`).join("")}</div><div id="drill" style="max-width:780px"></div></div>`;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function best(k,v){if(S.drill[k]===undefined||v>S.drill[k]){S.drill[k]=v;save()}}
function bindTrainer(tab){
  tab=TABS.some(t=>t[0]===tab)?tab:"scopecat";
  $$("[data-tab]").forEach(b=>b.onclick=()=>location.hash="#/trainer/"+b.dataset.tab);
  const box=$("#drill");
  if(DRILLS[tab]){const D=DRILLS[tab];let items=shuffle(D.items),i=0,ok=0,answered=false;
    const draw=()=>{if(i>=items.length){const pct=Math.round(ok/items.length*100);best(tab,pct+"%");box.innerHTML=`<div class="drill"><h2>${ok} из ${items.length}</h2><p>${pct>=90?"Различение работает почти автоматически.":pct>=60?"Хорошая база. Пройди ещё раз, чтобы закрепить.":"Перечитай урок и попробуй снова."}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="dAgain">Ещё раз</button><a class="btn ghost" href="#/lesson/${D.lesson}">Открыть урок</a></div></div>`;$("#dAgain").onclick=()=>{items=shuffle(D.items);i=0;ok=0;draw()};return}
      const it=items[i];answered=false;
      box.innerHTML=`<div class="drill"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>${D.title}</span><span>${i+1} / ${items.length} · верно ${ok}</span></div><div class="bar" style="margin-top:10px"><i style="width:${i/items.length*100}%"></i></div><div class="drill-card">${it.t}</div><div class="drill-btns">${D.opts.map(([k,n])=>`<button class="btn ghost" data-a="${k}">${n}</button>`).join("")}</div><div class="drill-fb" id="fb"></div></div>`;
      $$("[data-a]",box).forEach(b=>b.onclick=()=>{if(answered){return}answered=true;const right=b.dataset.a===it.a;if(right)ok++;
        b.style.borderColor=right?"var(--c1)":"var(--c4)";if(!right)$(`[data-a="${it.a}"]`,box).style.borderColor="var(--c1)";
        $("#fb").innerHTML=`<span style="color:${right?"var(--c1)":"var(--c4)"};font-weight:600">${right?"Верно.":"Не совсем."}</span> <span style="color:var(--text2)">${it.e}</span> <button class="btn sm" id="dNext" style="margin-left:8px">Дальше →</button>`;$("#dNext").onclick=()=>{i++;draw()};$("#dNext").focus()})};
    draw();return}
  if(tab==="negative"){let items=shuffle(NEGATIVES),i=0;const draw=()=>{const it=items[i%items.length];
    box.innerHTML=`<div class="drill"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>Перевод в позитив</span><span>${i%items.length+1} / ${items.length}</span></div><p style="margin-top:10px">Перепиши фразу так, чтобы в ней было описано желаемое действие или состояние, без «не» и без «но».</p><div class="drill-card">${it.t}</div><textarea id="negIn" placeholder="Твой вариант…" style="min-height:80px"></textarea><div id="negChk" class="drill-fb"></div><div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button class="btn" id="negShow">Проверить</button><button class="btn ghost" id="negNext">Следующая →</button></div></div>`;
    $("#negShow").onclick=()=>{const v=$("#negIn").value.trim();const bad=/(^|\s)(не|ни|нет|но|никогда)(\s|$|[,.!?])/i.test(v);$("#negChk").innerHTML=(v?(bad?`<span style="color:var(--c2);font-weight:600">В твоём варианте осталось отрицание или «но». </span>`:`<span style="color:var(--c1);font-weight:600">Без отрицаний, отлично. </span>`):"")+`<span style="color:var(--text2)">Один из вариантов: <q>${it.s}</q></span>`};
    $("#negNext").onclick=()=>{i++;draw()}};draw();return}
  if(tab==="levels"){let sets=shuffle(LEVEL_SETS),si=0,picked=[],score=0,done=0;const draw=()=>{if(si>=sets.length){best("levels",`${score}/${sets.length}`);box.innerHTML=`<div class="drill"><h2>${score} из ${sets.length} лестниц без ошибок</h2><p>Тест на уровень всегда один: «X является разновидностью Y?»</p><button class="btn" id="lvA">Ещё раз</button></div>`;$("#lvA").onclick=()=>{sets=shuffle(LEVEL_SETS);si=0;score=0;picked=[];draw()};return}
    const set=sets[si],sh=box._sh&&box._si===si?box._sh:(box._sh=shuffle(set),box._si=si,box._sh);
    box.innerHTML=`<div class="drill"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>Логические уровни</span><span>${si+1} / ${sets.length}</span></div><p style="margin-top:10px">Нажимай по порядку: от самого общего к самому конкретному.</p><div class="order-list">${sh.map(x=>{const p=picked.indexOf(x);return `<button class="${p>=0?"picked":""}" data-x="${esc(x)}"><span class="pos">${p>=0?p+1:"·"}</span>${esc(x)}</button>`}).join("")}</div><div class="drill-fb" id="lvFb"></div></div>`;
    $$("[data-x]",box).forEach(b=>b.onclick=()=>{const x=b.dataset.x;if(picked.includes(x)){picked=picked.filter(y=>y!==x);draw();return}picked.push(x);
      if(picked.length===set.length){const right=picked.every((v,k)=>v===set[k]);if(right)score++;draw();$("#lvFb").innerHTML=`<span style="color:${right?"var(--c1)":"var(--c4)"};font-weight:600">${right?"Верно.":"Правильный порядок:"}</span> <span style="color:var(--text2)">${right?"":set.join(" → ")}</span> <button class="btn sm" id="lvN" style="margin-left:8px">Дальше →</button>`;$("#lvN").onclick=()=>{si++;picked=[];draw()}}else draw()})};draw();return}
  if(tab==="mango"){let on=-1;const draw=()=>{box.innerHTML=`<div class="drill"><h2 style="font-size:20px">Где ударение, там и подтекст</h2><p>Нажми на слово, чтобы выделить его голосом. Под фразой появится то, что слушатель достроит сам.</p><div class="mango">${MANGO.words.map((w,i)=>`<button class="${i===on?"on":""}" data-w="${i}">${w}</button>`).join("")}</div><div class="drill-card" style="font-size:17px;font-weight:500;color:var(--text2)">${on>=0?MANGO.hint[on]:"Выбери слово"}</div><p style="font-size:14px;margin:0">Это один из шести приёмов «модели мира». Попробуй так же со своей фразой: <q>Ты опять не позвонил</q>.</p></div>`;$$("[data-w]",box).forEach(b=>b.onclick=()=>{on=+b.dataset.w;draw()})};draw();return}
}

/* ================= JOURNAL ================= */
function exEntries(){const out=[];
  EXERCISES.forEach(e=>{const d=S.ex[e.id];if(d)out.push({e,d,t:d._t||0,cur:1})});
  (S.arch||[]).forEach(a=>{const e=exById(a.id);if(e)out.push({e,d:a.d,t:a.t,cur:0})});
  return out.sort((a,b)=>b.t-a.t)}
function entryPairs(e,d){const res=[];
  if(e.steps) e.steps.forEach(s=>s.f.forEach(f=>{if(d[f.k]&&String(d[f.k]).trim())res.push([s.t+" · "+f.l,d[f.k]])}));
  else Object.entries(d).forEach(([k,v])=>{if(k.startsWith("_")||k==="oA"||k==="oB")return;if(Array.isArray(v)){if(v.length)res.push([k==="list"?"Критерии":k==="rounds"?"Раунды":k,v.map(x=>typeof x==="object"?(x.t||((x.c||"")+" → "+(x.o||"")+": "+(x.s||""))):x).join("\n")])}else if(typeof v==="string"&&v.trim())res.push([k,v])});
  if(d.oA&&d.oA.length)res.push(["Порядок: работа",d.oA.join(" → ")]);if(d.oB&&d.oB.length)res.push(["Порядок: дом",d.oB.join(" → ")]);
  return res}
function viewJournal(){
  document.documentElement.style.setProperty("--acc","var(--c6)");
  const E=exEntries().filter(x=>entryPairs(x.e,x.d).length);
  const doneN=LESSONS.filter(l=>S.done[l.id]).length;
  return `<div class="view"><div class="ex-head"><div class="eyebrow"><i></i>Мой журнал</div><h1>Записи и прогресс</h1><p class="lead">Всё, что ты написал в упражнениях. Данные хранятся только в этом браузере, поэтому иногда скачивай копию.</p></div>
  <div class="howto" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px"><div class="plate"><b style="font-size:28px">${doneN}/${LESSONS.length}</b><span>уроков пройдено</span></div><div class="plate"><b style="font-size:28px">${E.length}</b><span>записей в упражнениях</span></div><div class="plate"><b style="font-size:28px">${Object.keys(S.drill).length}/${TABS.length-2}</b><span>тренажёров с результатом</span></div></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px"><button class="btn" id="dl">Скачать журнал (.md)</button><button class="btn ghost" id="wipe">Стереть всё</button></div>
  ${E.length?E.map(x=>`<div class="card journal-entry"><h3><span>${x.e.title}</span><span class="chip">${x.t?new Date(x.t).toLocaleDateString("ru-RU",{day:"numeric",month:"short"}):""}${x.cur?" · текущая":" · архив"}</span></h3>${entryPairs(x.e,x.d).map(([k,v])=>`<div class="a"><b>${esc(k)}</b>${esc(v)}</div>`).join("")}${x.cur?`<a class="btn ghost sm" href="#/ex/${x.e.id}">Открыть упражнение</a>`:""}</div>`).join(""):`<div class="empty">Пока записей нет. Начни с упражнения <a href="#/ex/scope-script" style="color:var(--acc)">«Сценарий диапазона»</a>.</div>`}</div>`;
}
function bindJournal(){
  $("#dl").onclick=()=>{let md=`# Журнал практики · «Шесть слепых слонов»\n\nУроков пройдено: ${LESSONS.filter(l=>S.done[l.id]).length} из ${LESSONS.length}\n\n`;
    exEntries().forEach(x=>{const P=entryPairs(x.e,x.d);if(!P.length)return;md+=`## ${x.e.title}${x.t?" ("+new Date(x.t).toLocaleString("ru-RU")+")":""}\n\n`;P.forEach(([k,v])=>md+=`**${k}**\n\n${v}\n\n`)});
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"}));a.download="zhurnal-slepye-slony.md";a.click()};
  $("#wipe").onclick=()=>{if(confirm("Стереть весь прогресс и все записи? Это нельзя отменить.")){localStorage.removeItem(KEY);S={done:{},quiz:{},ex:{},step:{},drill:{}};save();render();renderNav();toast("Всё стёрто")}};
}

/* ================= GLOSSARY ================= */
function viewGlossary(){
  document.documentElement.style.setProperty("--acc","var(--c4)");
  return `<div class="view"><div class="ex-head"><div class="eyebrow"><i></i>Словарь</div><h1>Термины книги</h1><p class="lead">Короткие определения. Каждый термин ведёт к уроку, где он разобран подробно.</p></div>
  <input type="text" id="gq" placeholder="Поиск по терминам…" style="max-width:420px;margin-bottom:20px"><div class="gloss" id="gl"></div></div>`;
}
function bindGlossary(){const draw=q=>{q=(q||"").toLowerCase();$("#gl").innerHTML=GLOSSARY.filter(g=>!q||g[0].toLowerCase().includes(q)||g[1].toLowerCase().includes(q)).map(([t,d,l])=>{const L=lessonById(l),p=partOf(L);return `<div class="plate" style="border-left:3px solid ${p.color}"><b>${t}</b><span>${d}</span><a href="#/lesson/${l}" style="color:${p.color}">Урок ${LESSONS.indexOf(L)+1}: ${L.title} →</a></div>`}).join("")||`<div class="empty">Ничего не найдено</div>`};$("#gq").oninput=e=>draw(e.target.value);draw()}

/* ================= ROUTER ================= */
function render(){
  clearInterval(TIMER); if("speechSynthesis" in window) speechSynthesis.cancel();
  const h=location.hash.replace(/^#\/?/,"").split("/");
  const v=$("#view");
  if(h[0]==="lesson"){v.innerHTML=viewLesson(h[1]);bindLesson(h[1])}
  else if(h[0]==="practice"){v.innerHTML=viewPractice()}
  else if(h[0]==="ex"){v.innerHTML=viewEx(h[1]);bindEx(h[1])}
  else if(h[0]==="trainer"){v.innerHTML=viewTrainer(h[1]);bindTrainer(h[1])}
  else if(h[0]==="journal"){v.innerHTML=viewJournal();bindJournal()}
  else if(h[0]==="glossary"){v.innerHTML=viewGlossary();bindGlossary()}
  else {v.innerHTML=viewHome()}
  renderNav();
  $("#side").classList.remove("open");$("#overlay").classList.remove("show");
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
$("#menuBtn").onclick=()=>{$("#side").classList.add("open");$("#overlay").classList.add("show")};
$("#overlay").onclick=()=>{$("#side").classList.remove("open");$("#overlay").classList.remove("show")};
render();
</script>
</body>
</html>
